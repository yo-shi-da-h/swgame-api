<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>数当てゲーム</title>
  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 40px; }
    .hidden { display: none; }
    #game-section, #ranking-section { background: #f4f4f4; padding: 20px; border-radius: 8px; display: inline-block; margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>🎯 1〜100 数当てゲーム</h1>

  <!-- ゲーム画面 -->
  <div id="game-section">
    <p>1から100までの数字を当ててください！</p>
    <input type="number" id="guessInput" min="1" max="100">
    <button onclick="checkGuess()">予想する！</button>
    <p id="message" style="font-weight: bold;"></p>
    <p>現在の回数: <span id="attemptCount">0</span>回</p>
  </div>

  <!-- クリア画面（最初は非表示） -->
  <div id="result-section" class="hidden">
    <h2>🎉 正解！ 🎉</h2>
    <p>名前を入力してランキングに登録しよう！</p>
    <input type="text" id="playerName" placeholder="あなたの名前">
    <button onclick="submitScore()">ランキングに登録</button>
  </div>

  <!-- ランキング画面 -->
  <div id="ranking-section">
    <h2>🏆 ランキング (トップ5) 🏆</h2>
    <ol id="rankingList"></ol>
  </div>

  <!-- ログインフォーム -->
<div id="login-section">
  <h2>ログイン</h2>
  <input type="email" id="email" placeholder="メールアドレス">
  <input type="password" id="password" placeholder="パスワード">
  <button onclick="login()">ログイン</button>
</div>

  <script>
    // 1〜100のランダムな数字を作る
    let targetNumber = Math.floor(Math.random() * 100) + 1;
    let attempts = 0;

    // 数字を判定する処理
    function checkGuess() {
      const guess = parseInt(document.getElementById('guessInput').value);
      const message = document.getElementById('message');
      if (isNaN(guess)) return;

      attempts++;
      document.getElementById('attemptCount').innerText = attempts;

      if (guess === targetNumber) {
        message.innerText = "おめでとうございます！正解です！";
        document.getElementById('game-section').style.display = 'none';
        document.getElementById('result-section').style.display = 'block';
      } else if (guess > targetNumber) {
        message.innerText = "もっと小さいです👇";
      } else {
        message.innerText = "もっと大きいです👆";
      }
    }

    // サーバーにスコアを送信する処理
     async function submitScore() {
  // 1. localStorage からログイン時に保存したトークンを取得
  const token = localStorage.getItem('token');

  if (!token) {
    alert('スコア登録にはログインが必要です！');
    return;
  }

  // 2. トークンをヘッダーに載せてスコア（attempts）を送信
  const response = await fetch('http://localhost:3000/scores', {
    method: 'POST',
    headers: { 
      'Content-Type': 'application/json',
      'Authorization': `Bearer ${token}` // ★これで認証をパスします
    },
    body: JSON.stringify({ attempts: attempts })
  });

  if (response.ok) {
    alert('登録しました！');
    location.reload();
  } else {
    alert('スコアの登録に失敗しました');
  }
}
// ログイン処理（トークンを localStorage に保存する）
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;

  try {
    const response = await fetch('http://localhost:3000/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: email, password: password })
    });

    const data = await response.json();

    if (response.ok) {
      // サーバーから返ってきた JWT トークンを保存！
      localStorage.setItem('token', data.token);
      alert('ログイン成功しました！');
    } else {
      alert('ログイン失敗: ' + (data.error || 'メールアドレスかパスワードが違います'));
    }
  } catch (error) {
    console.error(error);
    alert('通信エラーが発生しました');
  }
}

    // サーバーからランキングを取得して表示する処理
    async function loadRanking() {
      const response = await fetch('http://localhost:3000/scores');
      const scores = await response.json();
      const list = document.getElementById('rankingList');
      list.innerHTML = '';
      scores.forEach(score => {
        const li = document.createElement('li');
        li.innerText = `${score.user?.name ||  '名無し'} さん : ${score.attempts}回でクリア`;
        list.appendChild(li);
      });
    }

    // ページを開いたときにランキングを読み込む
    loadRanking();
  </script>
</body>
</html>
